<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 212, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 212, 255, 0.05)" />
    </linearGradient>

    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.85)" />
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.65)" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.5px;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 11.5px;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Card Background -->
  <rect width="900" height="250" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="250" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Accents -->
  <circle cx="80" cy="50" r="90" fill="rgba(0, 212, 255, 0.12)" filter="url(#glowCyan)" />
  <circle cx="820" cy="180" r="110" fill="rgba(168, 85, 247, 0.14)" filter="url(#glowPurple)" />

  <!-- Outer Border -->
  <rect width="898" height="248" x="1" y="1" rx="15" fill="none" stroke="url(#accentBorder)" stroke-width="1.5" />

  <!-- Top Status Pill -->
  <g transform="translate(50, 32)">
    <rect width="395" height="28" rx="14" fill="url(#pillBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <circle cx="16" cy="14" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4" />
    <text x="32" y="18" class="status-text">Available for Projects &amp; Retainers · Jaipur, India</text>
  </g>

  <!-- Main Name & Heading -->
  <text x="50" y="105" fill="url(#neonCyanPurple)" class="name-title">LOKENDRA SINGH SHEKHAWAT</text>
  <text x="50" y="132" class="role-title">Senior Full-Stack Web &amp; SaaS Engineer · AI Solutions Lead | Founder @ Eyvy Solutions</text>

  <!-- Tech Highlights Pill 1: Core Web & Frameworks -->
  <g transform="translate(50, 160)">
    <rect width="380" height="34" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1" />
    <text x="16" y="22" fill="#00d4ff" class="tag-text">⚡ React · Next.js · Node.js · PHP · Python · FastAPI</text>
  </g>

  <!-- Tech Highlights Pill 2: AI & Cloud -->
  <g transform="translate(442, 160)">
    <rect width="408" height="34" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
    <text x="16" y="22" fill="#c084fc" class="tag-text">🤖 AI Agent Orchestration · REST APIs · SaaS &amp; Cloud</text>
  </g>

  <!-- Bottom Mini Sub-Line -->
  <g transform="translate(50, 218)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#64748b">
      7+ Years Experience &nbsp;•&nbsp; Production Web Apps &nbsp;•&nbsp; High-Speed APIs &nbsp;•&nbsp; LLM &amp; Workflow Automations
    </text>
  </g>
</svg>
